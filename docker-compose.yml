services:
  postgres:
    image: postgres:15
    container_name: sla_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sla_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sla_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: sla_api
    environment:
      DATABASE_URL: "postgresql://root:password123@postgres:5432/sla_tracker?schema=public"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      BUSINESS_TIMEZONE: "Asia/Kolkata"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: